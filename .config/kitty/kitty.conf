# Font Configuration
font_size 10.5
font_family FiraCode Nerd Font Mono

# Cursor Configuration
cursor_shape beam
shell_integration enabled

# Window Config
window_padding_width 12
background_opacity 0.95
background_blur 12

# Scrollback
scrollback_lines 8000

# Terminal features
strip_trailing_spaces smart
notify_on_cmd_finish invisible
enable_audio_bell no

# Keybinds
map ctrl+v paste_from_clipboard
map ctrl+c copy_and_clear_or_interrupt
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0 change_font_size all 0
map ctrl+left send_text all \x1bb
map ctrl+right send_text all \x1bf
map ctrl+backspace send_text all \x1b\x7f
map ctrl+delete send_text all \x1bd
map shift+left send_text all \x1b[1;2D
map shift+right send_text all \x1b[1;2C
map ctrl+shift+left send_text all \x1b[1;6D
map ctrl+shift+right send_text all \x1b[1;6C
map shift+home send_text all \x1b[1;2H
map shift+end send_text all \x1b[1;2F
map ctrl+shift+home send_text all \x1b[1;6H
map ctrl+shift+end send_text all \x1b[1;6F
map shift+page_up scroll_page_up
map shift+page_down scroll_page_down

mouse_map left click ungrabbed mouse_handle_click selection link prompt

# Tab configuration
tab_bar_style powerline
tab_bar_align left

# Dank color generation
include dank-tabs.conf
include dank-theme.conf


